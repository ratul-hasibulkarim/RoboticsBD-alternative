name: ci
on:
  push: { branches: [main] }
  pull_request:

concurrency: { group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }

jobs:
  python:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env: { POSTGRES_USER: voltfind, POSTGRES_PASSWORD: voltfind, POSTGRES_DB: voltfind_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U voltfind" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://voltfind:voltfind@localhost:5432/voltfind_test
      DATABASE_URL: postgresql+asyncpg://voltfind:voltfind@localhost:5432/voltfind_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Lint (ruff) + types (mypy --strict)
        run: |
          ruff check .
          mypy common crawler resolver price search api scripts
      - name: C1 — robots.txt gate for every approved crawl source
        run: python scripts/validate_robots.py
      - name: W7 — ads placement policy
        run: python scripts/check_ads_policy.py
      - name: Tests (C1–C6, R1–R3, P1–P4, A2–A3, crawler E2E)
        run: pytest -q

  web:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests (contract, attribution, JSON-LD, ads)
        run: npm test
      - name: W3 — JSON-LD validation
        run: npm run validate:schema
      - name: W4–W6 — SSR, sitemaps, canonicals (build + start against fixture API)
        run: npm run check:site
      - name: E2/E3 — Playwright journeys (mobile 375×667, search → click-out)
        run: |
          npx playwright install --with-deps chromium
          SKIP_BUILD=1 npm run e2e

  # Benchmarks — run on demand, not merge gates (spec v1.1 §0 row 28).
  lighthouse:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: echo "Run web/scripts/lighthouse-ci.js against a deployed preview URL (W1/W2)."

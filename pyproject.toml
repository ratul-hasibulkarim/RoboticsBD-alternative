[project]
name = "voltfind"
version = "0.1.0"
description = "VoltFind — electronics component search and price engine"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pgvector>=0.3",
  "httpx[http2]>=0.27",
  "protego>=0.3",
  "selectolax>=1.0",
  "celery>=5.4",
  "redis>=5.0",
  "pyyaml>=6.0",
  "typesense>=0.21",
  "orjson>=3.10",
  "rapidfuzz>=3.9",
  "boto3>=1.34",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=3.0"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "fakeredis>=2.23",
  "ruff>=0.5",
  "black>=24.4",
  "mypy>=1.10",
  "types-PyYAML",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["common*", "crawler*", "resolver*", "price*", "search*", "api*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["crawler/tests", "resolver/tests", "price/tests", "search/tests", "api/tests", "tests/python"]
markers = [
  "db: needs a running Postgres (DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "api/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101", "S311", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]
"scripts/**" = ["S603", "S607"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["web/", "api/alembic/versions/"]

[[tool.mypy.overrides]]
module = ["protego", "celery.*", "kombu.*", "typesense.*", "pgvector.*", "sentence_transformers", "respx", "fakeredis.*"]
ignore_missing_imports = true

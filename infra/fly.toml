# Fly.io API service (web deploys separately). Secrets: fly secrets set SECRET_KEY=… DATABASE_URL=… REDIS_URL=…
app = "voltfind-api"
primary_region = "sin"   # Singapore: lowest latency to Dhaka among Fly regions

[build]
  dockerfile = "docker/python.Dockerfile"

[env]
  ENV = "prod"

[deploy]
  release_command = "alembic -c api/alembic.ini upgrade head"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 2

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"

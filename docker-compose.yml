# Dev / demo stack. `make demo` boots everything and seeds the demo dataset.
name: voltfind

x-py: &py
  build: { context: ., dockerfile: infra/docker/python.Dockerfile }
  env_file: [.env.example]
  environment:
    DATABASE_URL: postgresql+asyncpg://voltfind:voltfind@postgres:5432/voltfind
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    TYPESENSE_HOST: typesense
    S3_ENDPOINT: http://minio:9000
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    WEB_REVALIDATE_URL: http://web:3000/api/revalidate
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    typesense: { condition: service_started }

services:
  postgres:
    # Timescale HA image ships TimescaleDB + pgvector on Postgres 16.
    image: timescale/timescaledb-ha:pg16.6-ts2.17.2
    environment: { POSTGRES_USER: voltfind, POSTGRES_PASSWORD: voltfind, POSTGRES_DB: voltfind }
    ports: ["5432:5432"]
    volumes: [pgdata:/home/postgres/pgdata/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U voltfind"], interval: 5s, retries: 20 }

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }

  typesense:
    image: typesense/typesense:27.1
    command: ["--data-dir", "/data", "--api-key", "voltfind-dev-key", "--enable-cors"]
    ports: ["8108:8108"]
    volumes: [tsdata:/data]

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb -p local/voltfind-raw; mc ilm rule add --expire-days 30 local/voltfind-raw; true"

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025", "1025:1025"]

  migrate:
    <<: *py
    command: ["alembic", "-c", "api/alembic.ini", "upgrade", "head"]
    restart: "no"

  api:
    <<: *py
    command: ["uvicorn", "api.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *py
    command: ["celery", "-A", "crawler.tasks", "worker", "-Q", "crawl.seed,crawl.fetch,crawl.resolve,search.index,maintenance", "-c", "4", "--loglevel", "INFO"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  beat:
    <<: *py
    command: ["celery", "-A", "crawler.tasks", "beat", "--loglevel", "INFO"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: ./web, dockerfile: ../infra/docker/web.Dockerfile, args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" } }
    environment:
      API_URL: http://api:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      REVALIDATE_SECRET: dev-revalidate-secret
    ports: ["3000:3000"]
    depends_on: [api]

volumes: { pgdata: {}, tsdata: {}, miniodata: {} }
